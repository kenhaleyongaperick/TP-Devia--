<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpolation !</title>
</head>
<body>
    <script>
        const qualf = new String ("Island"); // new String ("")
        const place = "ParkaA"; // ""; ''; ``
        const full = `I wish meet tonight at ${qualf} ${place}`; console.log(full);
        console.log(place.split(""));
        console.log(place.slice(0, 3));
        console.log(place.length, place[place.length -1]);
        console.log("LowerCase :", place.toLowerCase(), "UpperCase :", place.toUpperCase());
        console.log(place.indexOf("a"));
        console.log(place.lastIndexOf("a"));
        console.log(place.includes("a"));
        console.log(place.startsWith("Pa"));
        console.log(place.toLowerCase().startsWith("pa"));
        console.log(place[0], place.charAt(2));
        console.log(place.at(1), place.at(-1));
