<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays in JS !</title>
    <meta name="description" content="Me !">
    <style>
        * {
            margin: 15px;
        }
    </style>

<body>
    <h1>Map & Filter !</h1>
    <h1 id="values"></h1>
    <h1 id="mapRes"></h1>
    <h1 id="filterRes"></h1>
    <script>
        const numbers = [1, 2, 3, 4, 5];
        document.getElementById("values").textContent = "Default array is : " + numbers;
        const multiply = numbers.map(num => num * 2);
        document.getElementById("mapRes").textContent = "Result wit' Map : " + multiply;
        const even = numbers.filter(num => num % 2 == 0);
        document.getElementById("filterRes").textContent = "Result wit' Filter : " + even;
        console.log(numbers); console.log(multiply); console.log(even);
    </script>
</body>

</html>
